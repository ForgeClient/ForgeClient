[package]
name = "faf-ipc"
description = "IPC contract: generates TypeScript bindings for AppState/AppCommand/AppEvent. The anti-drift boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
# Never goes to crates.io: the workspace crates reach each other by path, and
# cargo-deny only tolerates a path dependency in a crate that says so.
publish = false

[dependencies]
faf-domain = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
