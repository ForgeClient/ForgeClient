[package]
name = "faf-domain"
description = "Pure domain layer: state, events, commands, reducer. No IO, no async."
version.workspace = true
edition.workspace = true
license.workspace = true
# Never goes to crates.io: the workspace crates reach each other by path, and
# cargo-deny only tolerates a path dependency in a crate that says so.
publish = false

[dependencies]
serde = { workspace = true }
# A codec, like `base64` below: not IO. `protocol::discord` builds and reads
# Discord's IPC payloads, which are JSON, and those belong with the rest of the
# wire formats rather than leaking into `faf-app`.
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
base64 = "0.22"
chrono = "0.4"
