[package]
name = "faforever-rust-client"
description = "FAF client: Tauri shell. Thin: wires faf-app to Tauri commands/events. No logic."
version.workspace = true
edition.workspace = true
license.workspace = true
# Never goes to crates.io: the workspace crates reach each other by path, and
# cargo-deny only tolerates a path dependency in a crate that says so.
publish = false

[lib]
name = "faforever_rust_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Native file picker, used by the Replays tab to open a local .fafreplay file.
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Refuses a second client and hands its arguments to the first. From
# `tauri-apps/plugins-workspace`, the same organisation and repository as the
# three plugins above; its eight dependencies were all already in the lockfile,
# so it adds nothing transitively.
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = "0.3"
faf-domain = { workspace = true }
faf-app = { workspace = true }
tauri-plugin-window-state = "2"

[[bin]]
name = "faforever-rust-client"
path = "src/main.rs"
